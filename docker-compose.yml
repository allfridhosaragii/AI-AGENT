# MUFAKAT — Postgres + Redis opsional (docker-compose).
#
# Jujur: compose ini HANYA menyediakan database dan cache untuk
# pengembangan lokal. MUFAKAT tetap jalan tanpa compose ini
# (default: SQLite + cache in-memory). Docker TIDAK terpasang di
# semua mesin — bila `docker compose` tidak tersedia, abaikan file
# ini dan pakai default SQLite.
#
# Keamanan (audit M11): port HANYA di 127.0.0.1 (dulu 0.0.0.0 —
# bisa diakses siapa pun di Wi-Fi yang sama). Password WAJIB dari
# file .env (salin .env.example -> .env, isi password kuat);
# Redis memakai requirepass.
#
# Cara pakai:
#   cp .env.example .env   # isi POSTGRES_PASSWORD & REDIS_PASSWORD
#   docker compose up -d
#   DATABASE_URL=postgresql://mufakat:<POSTGRES_PASSWORD>@localhost:5432/mufakat \
#   REDIS_URL=redis://:<REDIS_PASSWORD>@localhost:6379/0 \
#   mufakat run "Buat REST API todo dengan FastAPI + test + audit"
#
# Jangan commit file .env berisi password nyata.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mufakat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: mufakat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mufakat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mufakat -d mufakat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - mufakat_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Layanan aplikasi (opsional, butuh build image sendiri):
  # app:
  #   build: .
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql://mufakat:${POSTGRES_PASSWORD}@db:5432/mufakat
  #     REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  #   volumes:
  #     - ./runs:/app/runs

volumes:
  mufakat_pgdata:
  mufakat_redisdata:
