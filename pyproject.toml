[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mufakat"
version = "0.1.0"
description = "MUFAKAT — sistem multi-AI agent: debat, konsensus, dan verifikasi kode."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MUFAKAT" }]
dependencies = [
    # Dipin ke versi yang terpasang & teruji di VM 20 Nov 2026
    # (lihat requirements.lock; `mcp==2.3.0` sesuai DECISIONS A12).
    "langgraph==1.2.23",
    "langgraph-checkpoint-sqlite==3.1.3",
    "fastmcp==4.2.2",
    "mcp==2.3.0",
    "openai==3.56.0",
    "pydantic==2.14.4",
    "typer==0.29.2",
    "rich==15.0.0",
    "sqlmodel==0.0.50",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "bandit==1.9.4",
]
# Postgres (opsional): DATABASE_URL=postgresql://... — tanpa ini,
# MUFAKAT tetap jalan dengan SQLite.
postgres = [
    "psycopg[binary]==3.3.9",
]
# Redis (opsional): REDIS_URL=redis://... — tanpa ini, cache/queue
# memakai fallback in-memory.
redis = [
    "redis==8.1.0",
]

[project.scripts]
mufakat = "mufakat.cli:app"
mufakat-mcp = "mufakat.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Artefak run (runs/*/worktree/test_main.py) tidak boleh dikoleksi:
# tiap run punya test_main.py yang sama namanya sehingga pytest
# gagal "import file mismatch" begitu ada >1 run (ditemukan Putaran 2
# setelah mock run membuat runs/c2052540).
testpaths = ["tests"]
norecursedirs = ["runs", ".venv", ".git", "__pycache__", ".mypy_cache", ".ruff_cache"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
