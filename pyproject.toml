[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mufakat"
version = "0.1.0"
description = "MUFAKAT — sistem multi-AI agent: debat, konsensus, dan verifikasi kode."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MUFAKAT" }]
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "fastmcp",
    "mcp",
    "openai",
    "pydantic>=2",
    "typer",
    "rich",
    "sqlmodel",
    "pyyaml",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "bandit",
]
# Postgres (opsional): DATABASE_URL=postgresql://... — tanpa ini,
# MUFAKAT tetap jalan dengan SQLite.
postgres = [
    "psycopg[binary]",
]
# Redis (opsional): REDIS_URL=redis://... — tanpa ini, cache/queue
# memakai fallback in-memory.
redis = [
    "redis",
]

[project.scripts]
mufakat = "mufakat.cli:app"
mufakat-mcp = "mufakat.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Artefak run (runs/*/worktree/test_main.py) tidak boleh dikoleksi:
# tiap run punya test_main.py yang sama namanya sehingga pytest
# gagal "import file mismatch" begitu ada >1 run (ditemukan Putaran 2
# setelah mock run membuat runs/c2052540).
testpaths = ["tests"]
norecursedirs = ["runs", ".venv", ".git", "__pycache__", ".mypy_cache", ".ruff_cache"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
